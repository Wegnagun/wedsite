
name: Django-app workflow

on: [push]

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LOGIN_DOCKERHUB }}
          password: ${{ secrets.PASS_DOCKERHUB }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: wegnagun/weddingsite:latest

  deploy:
      if: ${{ github.ref == 'refs/heads/master' }}
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub
      steps:
      - name: pull docker image
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd wedsite|| exit 1
            sudo docker rmi -f wegnagun/weddingsite:latest || true
            sudo docker pull ${{ secrets.USER }}/weddingsite:latest
            cat > .env <<EOF
            KEY=${{ secrets.KEY }}
            DB_ENGINE=${{ secrets.DB_ENGINE }}
            DB_NAME=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DBG=${{ secrets.DBG }}
            HOSTS=${{ secrets.HOSTS }}
            ORIGINS=${{ secrets.ORIGINS }}
            EOF
            sudo docker-compose down
            sudo docker-compose up -d --build
  