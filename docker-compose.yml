services:
  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    env_file:
      - ./.env


  nginx:
    image: nginx:1.21.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/conf.d:/etc/nginx/conf.d:ro
      - static_value:/usr/share/nginx/html/static/:ro
      - media_value:/usr/share/nginx/html/media/:ro
    depends_on:
      - web
    env_file:
      - ./.env

volumes:
  static_value:
  media_value:
